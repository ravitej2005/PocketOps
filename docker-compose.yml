services:
  mysql:
    image: mysql:8.0
    container_name: pocketops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - pocketops-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pocketops-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      POCKETOPS_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      POCKETOPS_DB_USERNAME: ${MYSQL_USER}
      POCKETOPS_DB_PASSWORD: ${MYSQL_PASSWORD}
      POCKETOPS_PUBLIC_BASE_URL: ${POCKETOPS_PUBLIC_BASE_URL}
      POCKETOPS_AGENT_GRPC_HOST: ${POCKETOPS_AGENT_GRPC_HOST}
      POCKETOPS_AGENT_GRPC_PORT: ${POCKETOPS_AGENT_GRPC_PORT}
    ports:
      - "8080:8080"
volumes:
  pocketops-mysql-data:
